<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>查看图片</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
      }
      img {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <img
      id="nga-large-image"
      src="{{imageSrc}}"
      alt=""
      data-vscode-context='{"webviewSection": "nga-image", "imageSrc": "{{imageSrc}}"}'
    />
    <script src="{{ contextPath }}/html/image-copy.js"></script>
  </body>
</html>
